# The dev pre-release channel (v1-e01-t09-dev-prerelease-channel).
#
# Every merge to dev whose `ci` run is green becomes an installable GitHub pre-release,
# vX.Y.Z-dev.N, so what is later promoted to main is a build that already ran rather than a source
# tree (docs/process/branching-and-environments.md). A manual dispatch on a hotfix/* branch does the
# same for the hotfix head, tagged with its patch target (v1.1.1-dev.1), so a hotfix is validated in
# dev like any other change. Install one with scripts/install_channel.sh <tag>.
#
# What one run does, for exactly one commit:
#   1. claim the tag: scripts/release_version.py pushes vX.Y.Z-dev.N at the commit *before*
#      anything is built. The push is the atomic claim; a rejected push means an overlapping run
#      took that N, and the script lists the tags again and tries the next one.
#   2. stamp the checkout (version X.Y.Z.devN, build info, bundled config/), build the debate_core
#      and debate_cli wheels, and refuse them if they are not exactly what should ship; then install
#      them with scripts/install_channel.sh into a throwaway tool directory and refuse a build that
#      cannot import every integration the CLI wires (v1-e01-t17).
#   3. publish a GitHub *pre-release* for that tag with the wheels, SHA256SUMS and build-info.json.
#   4. ask validate-dev (v1-e01-t10) to validate the build: a dispatch of validate-dev.yml for this
#      commit and tag, because a release created with GITHUB_TOKEN starts no workflow of its own.
#   5. prune: delete the release (never the tag) of dev pre-releases beyond the newest 30.
#
# Not part of `ci`, and not a required check. It runs after a merge, on its own trigger, and hands
# each build to validate-dev (v1-e01-t10), whose status is what protect-main requires; ci.yml's
# header records when a separate workflow is right.
#
# SECURITY. This workflow writes: it creates tags and releases, so the one job holds
# `contents: write`, plus `actions: write` to dispatch validate-dev, and the workflow default is
# `contents: read`. It never runs on `pull_request`:
# `workflow_run` executes the workflow file from the default branch against a commit already pushed
# to dev, and `workflow_dispatch` is limited to hotfix/* branches of this repository, which only
# maintainers can push. The checkout persists no credentials. The token reaches git only in the
# claim step (as an extra HTTP header through GIT_CONFIG_* variables) and gh only in the steps that
# call it; the build steps never see it. No repository secret is read: GITHUB_TOKEN is enough, and a
# tag pushed with it triggers no other workflow.
#
# Tags are immutable once published (the task spec forbids re-tagging or rebuilding a
# vX.Y.Z-dev.N). A re-run for a commit that already has a published pre-release does nothing; a
# re-run for a commit whose tag was claimed but whose release never appeared builds and publishes it
# under that same tag, which is the first publication of that version, not a rebuild.

name: Dev pre-release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per commit at a time, so a re-run and the original cannot both build the same tag.
  # Deliberately not one group for the whole workflow: GitHub keeps only one pending run per group
  # and cancels the rest, which would silently skip the pre-release of a merge that landed while
  # two others were in flight. Runs for different commits overlap; the tag claim keeps N unique.
  group: dev-prerelease-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish dev pre-release
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'dev'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch'
        && startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERSION_SOURCE: ${{ github.event_name == 'workflow_dispatch' && 'hotfix' || 'dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
          # Every tag and all history: a hotfix's patch target is the newest stable tag its head
          # contains, and a dev build refuses a version that already has a stable tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Claim the next vX.Y.Z-dev.N by pushing its tag at the head commit
        id: claim
        env:
          TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          python3 scripts/release_version.py claim --source "$VERSION_SOURCE" --sha "$HEAD_SHA"

      - name: Skip a commit whose pre-release is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.claim.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "$TAG is already published; tags are immutable, so there is nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        if: steps.existing.outputs.published == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        if: steps.existing.outputs.published == 'false'
        run: uv python install

      - name: Stamp the version, build info and bundled configuration
        if: steps.existing.outputs.published == 'false'
        env:
          TAG: ${{ steps.claim.outputs.tag }}
          VERSION: ${{ steps.claim.outputs.version }}
        run: >-
          python3 scripts/stamp_build.py stamp
          --version "$VERSION" --tag "$TAG" --channel dev
          --commit "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --dist dist

      - name: Build the debate_core and debate_cli wheels
        if: steps.existing.outputs.published == 'false'
        run: |
          uv build --package debate-core --wheel --out-dir dist
          uv build --package debate-cli --wheel --out-dir dist

      - name: Refuse wheels that are not exactly what should ship
        if: steps.existing.outputs.published == 'false'
        env:
          VERSION: ${{ steps.claim.outputs.version }}
        run: python3 scripts/stamp_build.py check-wheels --version "$VERSION" --dist dist

      - name: Write SHA256SUMS
        if: steps.existing.outputs.published == 'false'
        working-directory: dist
        run: |
          sha256sum -- *.whl build-info.json > SHA256SUMS
          cat SHA256SUMS

      - name: Install the build as its users will and check it can import everything it wires
        # v1-e01-t17. The same install_channel.sh a coach and the launchd agent run, against the
        # assets about to be published, into a throwaway tool directory. Its post-install check
        # imports every integration the CLI's composition root wires, so a build that cannot do what
        # its commands are wired to do (v0.1.0-dev.33 had no boto3) fails here and is never
        # published. Its tag stays claimed and its number is skipped, as for any failed build.
        # The script also runs `doctor` (v1-e01-t14), so a build on a Python whose Unicode database
        # the normalizer is not pinned to fails here too. --no-path-warning: the tool directory is
        # never on this runner's PATH, so the warning that says so is noise (v1-e01-t14 ac6).
        if: steps.existing.outputs.published == 'false'
        env:
          TAG: ${{ steps.claim.outputs.tag }}
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/verify-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/verify-bin"
          sh scripts/install_channel.sh --no-path-warning --dir dist "$TAG"

      - name: Publish the GitHub pre-release
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.claim.outputs.tag }}
          VERSION: ${{ steps.claim.outputs.version }}
        run: |
          {
            echo "Dev pre-release of debate-research ${VERSION} (channel dev), built from"
            echo "${HEAD_SHA} by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo
            echo "Install: \`scripts/install_channel.sh ${TAG}\`"
            echo
            echo "Runs as DEBATE_ENV=dev unless DEBATE_ENV says otherwise. Not a stable release."
          } > release-notes.md
          # --prerelease always: a dev build is never a full release (task spec, forbidden list).
          # --verify-tag: publish only under the tag the claim step pushed; never create one here.
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS dist/build-info.json \
            --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
            --title "debate-research ${TAG} (dev pre-release)" --notes-file release-notes.md

      - name: Ask validate-dev to validate this build
        # v1-e01-t10. validate-dev.yml also listens for `release: prereleased`, but a release created
        # with GITHUB_TOKEN starts no workflow; a dispatch is the one event this token may cause. It
        # runs validate-dev.yml from dev, or from the hotfix branch for a hotfix head, against exactly
        # this commit and tag. Also on a re-run whose release already existed, so re-running this
        # workflow re-validates. A commit from before validate-dev existed (a hotfix branch cut from a
        # main that predates it) has no workflow to dispatch; that is reported, not failed.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.claim.outputs.tag }}
          REF: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'dev' }}
        run: |
          if [ ! -f .github/workflows/validate-dev.yml ]; then
            echo "::notice::${HEAD_SHA} predates validate-dev.yml; nothing to dispatch."
            exit 0
          fi
          gh workflow run validate-dev.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" \
            -f sha="$HEAD_SHA" -f tag="$TAG"
          echo "Dispatched validate-dev.yml on ${REF} for ${TAG} at ${HEAD_SHA}."

      - name: Keep the newest 30 dev pre-releases
        # Deletes old releases and keeps their tags, so N keeps counting and is never reused.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 \
            --json tagName,isPrerelease,createdAt > releases.json
          python3 scripts/release_version.py prune --keep 30 < releases.json > prune.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pruning the release of $tag (the tag stays)"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done < prune.txt

      - name: Summary
        if: always() && steps.claim.outputs.tag != ''
        env:
          TAG: ${{ steps.claim.outputs.tag }}
          VERSION: ${{ steps.claim.outputs.version }}
          PUBLISHED_BEFORE: ${{ steps.existing.outputs.published }}
        run: |
          {
            echo "### ${TAG}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${HEAD_SHA}\` |"
            echo "| Wheel version | \`${VERSION}\` |"
            echo "| Source | ${VERSION_SOURCE} |"
            echo "| Already published before this run | ${PUBLISHED_BEFORE:-false} |"
            echo
            echo "Install with \`scripts/install_channel.sh ${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
