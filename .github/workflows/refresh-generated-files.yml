# Keeps the two generated files fresh on dev (v1-e01-t16-generated-docs-index ac5).
#
# ROADMAP.md (scripts/spec_index.py) and docs/README.md's table (scripts/docs_index.py) are derived
# from the tree. Task pull requests never regenerate them, because every task that touched them
# would conflict with every other open task, so each merge into dev leaves them stale. Until this
# workflow, nothing noticed until a promotion's `spec-validate` failed on `spec_index.py --check`
# (four promotions out of four, #154). Now every push to dev regenerates both from dev's tip and
# keeps exactly one pull request, "Refresh generated files", from bot/refresh-generated-files into
# dev with the result: opened when dev goes stale, force-pushed when dev moves again, closed when
# dev is fresh. Merging it is still a person's click, and the promotion checklist
# (docs/runbooks/team-website.md) says to do it first; nobody has to notice or regenerate anything.
#
# Why a pull request and not a check on dev pull requests: a check that failed on a stale index
# would ask every task session to regenerate the files, which is the conflict this avoids. Why not
# a push straight to dev: protect-dev requires a pull request and the `ci` check, and has no bypass.
# Why not auto-merge: a merge made with GITHUB_TOKEN starts no workflow, so the merge commit would
# get no `ci` on dev, no dev pre-release and no `validate-dev`, and the next promotion from it would
# be blocked.
#
# The pull request's checks. protect-dev requires one status check, `ci` from GitHub Actions
# (docs/process/rulesets/protect-dev.json). A pull request opened or pushed with GITHUB_TOKEN starts
# no pull_request workflow, so `ci` would never report and the pull request could never merge. The
# one event that token may start is workflow_dispatch, so the second job dispatches ci.yml on the
# branch, and the `ci` check run lands on the branch's head commit, which is the pull request's head:
# the same route dev-prerelease.yml uses to start validate-dev. ci.yml has a workflow_dispatch
# trigger for this.
#
# SECURITY. Runs only on push to dev and on a manual dispatch from dev, never on a pull request, so
# it only ever executes code that has already merged. The workflow default is `permissions: {}`.
# `regenerate` holds contents: write (push the branch, delete it when closing) and
# pull-requests: write (open, close, label); its checkout persists no credentials, so the generators
# run without a token on disk, and the token reaches git only in the push step, as an extra HTTP
# header. `dispatch-ci` holds actions: write and checks out nothing. No secret is read.
#
# Needs the repository setting Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests", which back-merge.yml already needs.

name: Refresh generated files

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  # One run at a time; GitHub keeps only the newest pending run, which is the one that matters,
  # because each run regenerates from dev's tip at the time it runs rather than from its own event.
  group: refresh-generated-files
  cancel-in-progress: false

env:
  BRANCH: bot/refresh-generated-files

jobs:
  regenerate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push bot/refresh-generated-files, delete it when dev is fresh
      pull-requests: write # open, close and label the refresh pull request
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python from .python-version
        run: uv python install
      - name: Install the locked workspace
        run: uv sync --locked --all-packages
      - name: Regenerate ROADMAP.md and docs/README.md
        # A generator that fails (a document without a description reached dev) fails the job, which
        # is the signal; --check-descriptions on every pull request is meant to stop that first.
        run: |
          uv run --frozen python scripts/spec_index.py
          uv run --frozen python scripts/docs_index.py
      - name: Publish the refresh pull request, or close it if dev is fresh
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open_pr=$(gh pr list --repo "$REPO" --base dev --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          dev_sha=$(git rev-parse HEAD)

          if git diff --quiet -- ROADMAP.md docs/README.md; then
            echo "ROADMAP.md and docs/README.md are fresh on dev at $dev_sha."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --repo "$REPO" --delete-branch \
                --comment "dev at $dev_sha already has fresh generated files, so this is no longer needed."
            fi
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --stat -- ROADMAP.md docs/README.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Refresh ROADMAP.md and docs/README.md from dev at $dev_sha" \
            -- ROADMAP.md docs/README.md

          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          # GitHub refuses a push with this token that would create or update a file under
          # .github/workflows/ (back-merge.yml's header), and moving the branch from an older dev to
          # a newer one may count as that if dev's workflows changed in between. A new branch
          # whose only new commit is this one touches no workflow, so on a refusal the branch and
          # its pull request are replaced rather than left stuck behind the refusal for good.
          if ! git push --force origin "HEAD:refs/heads/$BRANCH"; then
            echo "::warning::The force-push was refused; recreating $BRANCH and its pull request."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --repo "$REPO" --delete-branch \
                --comment "Replaced by a fresh pull request: this branch could not be moved to dev at $dev_sha."
              open_pr=""
            else
              git push origin --delete "$BRANCH"
            fi
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ -n "$open_pr" ]; then
            echo "Refresh pull request #$open_pr now carries dev at $dev_sha."
            exit 0
          fi
          {
            echo "\`ROADMAP.md\` and \`docs/README.md\` are generated from the tree, and dev has moved"
            echo "since they were last regenerated. This pull request carries both, regenerated from"
            echo "dev's tip; it is force-pushed whenever dev moves again and closed if dev becomes fresh."
            echo
            echo "- [ ] \`ci\` is green (dispatched by the workflow: a pull request opened with the"
            echo "      workflow token starts no checks of its own)."
            echo "- [ ] Merge it before opening a promotion, whose \`spec-validate\` checks both files."
            echo
            echo "Opened by .github/workflows/refresh-generated-files.yml (v1-e01-t16)."
          } > body.md
          gh pr create --repo "$REPO" --base dev --head "$BRANCH" \
            --title "Refresh generated files" --body-file body.md

  dispatch-ci:
    needs: regenerate
    if: needs.regenerate.outputs.head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatch ci.yml on the refresh branch
    # No checkout: this job holds a write permission and needs none of the repository's code.
    steps:
      - name: Run ci on the refresh branch, since its pull request starts no checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.regenerate.outputs.head }}
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          echo "Dispatched ci on $BRANCH for head $HEAD_SHA."
